name: PAM assurance

on:
  push:
    paths:
      - "assurance/**"
      - ".github/workflows/pam-assurance.yml"
  pull_request:
    paths:
      - "assurance/**"
      - ".github/workflows/pam-assurance.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PIR
        uses: actions/checkout@v4

      - name: Checkout pinned PAM
        uses: actions/checkout@v4
        with:
          repository: Pukujan/project-assurance-modules
          ref: 03fc55ae4036a9704cdb929fb3ae6dc520ae2183
          path: .pam

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PAM validator
        run: python -m pip install -e '.pam[dev]'

      - name: Validate project assurance manifest
        working-directory: .pam
        run: python -m scripts.pam_validate ../assurance/PROJECT_ASSURANCE.json

      - name: Validate current structured handoff
        working-directory: .pam
        run: python -m scripts.pam_handoff ../assurance/HANDOFF_STATE.json

      - name: Validate historical checkpoints
        working-directory: .pam
        run: |
          shopt -s nullglob
          checkpoints=(../assurance/checkpoints/*.json)
          for checkpoint in "${checkpoints[@]}"; do
            echo "validating $checkpoint"
            python -m scripts.pam_handoff "$checkpoint"
          done
