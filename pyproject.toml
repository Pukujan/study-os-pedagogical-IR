[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-os-pedagogical-ir"
version = "0.1.0.dev0"
description = "Canonical lossless Pedagogical IR for Study OS"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-jsonschema>=4.23",
  "mutmut>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["study_os_pir"]
